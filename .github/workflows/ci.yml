name: ci

on:
  push:
  pull_request:

jobs:
  # Fast Zig PR signal (not full suite — full suite lives in test.yml only).
  zig-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # PCRE2 is Zig-built from source via build.zig.zon (static link).
      - name: Build CLI
        run: ./scripts/zig build
      - name: Fast unit tests (lib + ryk core)
        run: ./scripts/zig build test-fast
      - name: Zig shell_engine pack + corpus parity
        run: ./scripts/zig build test-shell-engine
      - name: Token-enabled telemetry release contract
        run: ./scripts/test-telemetry-release-contract.sh
  # Landlock (ubuntu) / Seatbelt (macos-14) attach + adversarial e2e.
  # --require-attach is single authority (packaged ryk_run + profile_hash + evidence.zig rules).
  # Thin jq checks packaged primary detail only — no third copy of unit dual-proof greps.
  os-sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            case_id: ci-linux
            artifact_name: os-sandbox-evidence-linux
          - runs-on: macos-14
            case_id: ci-macos
            artifact_name: os-sandbox-evidence-macos
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # PCRE2 is Zig-built from source via build.zig.zon (static link).
      - name: Build ryk
        run: ./scripts/zig build
      - name: Secret boundary adversarial canary
        run: ./scripts/adversarial/secret-boundary-canary.sh --binary ./zig-out/bin/ryk
      - name: Adversarial OS sandbox e2e + evidence (require attach)
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          mkdir -p planning/security/evidence
          ./scripts/os-sandbox-adversarial-e2e.sh \
            --require-attach \
            --case "$CASE_ID" \
            --binary ./zig-out/bin/ryk \
            --out planning/security/evidence
          test -n "$(find planning/security/evidence -maxdepth 1 -type f -name "${CASE_ID}-*.json" -print -quit)"
          newest="$(find planning/security/evidence -maxdepth 1 -type f -name "${CASE_ID}-*.json" -print | sort | tail -1)"
          # Packaged primary attach + 64-hex hash + TEST-DENY (defense-in-depth with --require-attach).
          jq -e '
            .controls["CTRL-ATTACH"].ok == true
            and .controls["CTRL-ATTACH"].detail == "ryk_run_os_sandbox_on_active"
            and (.profile_hash | length) == 64
            and .controls["TEST-DENY"].ok == true
          ' "$newest"
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: planning/security/evidence/
          if-no-files-found: error

  # Release signing is a dry run on purpose: the secret key must never exist in
  # CI, so this proves the *verification* contract with a throwaway keypair. The
  # matrix covers both verifier implementations the installer accepts, and runs on
  # both platforms because the installer's shell is what differs between them.
  release-signing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            verifier: minisign
          - runs-on: macos-14
            verifier: minisign
          - runs-on: macos-14
            verifier: rsign
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.verifier }}
        env:
          VERIFIER: ${{ matrix.verifier }}
        run: |
          set -euo pipefail
          case "$VERIFIER" in
            minisign)
              if [ "$RUNNER_OS" = "Linux" ]; then
                sudo apt-get update && sudo apt-get install -y minisign
              else
                brew install minisign
              fi
              minisign -v
              ;;
            rsign)
              cargo install rsign2 --locked
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Signature contract (fail-closed boundary)
        run: ./scripts/test-release-signing.sh
      - name: Refuse to skip when a verifier is present
        run: |
          set -euo pipefail
          # The test skips when no verifier exists. A skip here would mean the
          # install step above silently failed, so the signal must be a real pass.
          ./scripts/test-release-signing.sh | tee /tmp/signing.log
          if grep -q 'SKIPPED' /tmp/signing.log; then
            echo "release signing test skipped despite an installed verifier" >&2
            exit 1
          fi
          grep -q 'test-release-signing: passed' /tmp/signing.log

  # Prove the formula in this checkout. Always install from a local tap built
  # here — do not `brew tap "$TAP" 2>/dev/null` (that hides a 404 and fail-opens
  # onto a stale published formula). brew installs the binary only;
  # `ryk doctor --fix` wires host plugins.
  homebrew-tap:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      TAP: christopherkarani/ryk
    steps:
      - uses: actions/checkout@v4
      - name: Formula contract (offline)
        run: ./scripts/test-homebrew-formula.sh
      - name: Tap the formula from this checkout
        run: |
          set -euo pipefail
          echo "tap_source=local" >> "$GITHUB_ENV"
          brew tap-new "$TAP"
          tap_dir="$(brew --repository "$TAP")"
          mkdir -p "${tap_dir}/Formula"
          cp packaging/homebrew/Formula/ryk.rb "${tap_dir}/Formula/ryk.rb"
      - name: brew install from the tap
        run: brew install --verbose "${TAP}/ryk"
      - name: Installed-binary smoke
        run: |
          set -euo pipefail
          command -v ryk
          ryk --version
          ryk doctor
          ryk redteam --ci
      - name: brew test (formula test block)
        run: brew test "${TAP}/ryk"
      - name: brew uninstall leaves nothing behind
        run: |
          set -euo pipefail
          brew uninstall "${TAP}/ryk"
          if command -v ryk >/dev/null 2>&1; then
            echo "::error::ryk still on PATH after brew uninstall"
            exit 1
          fi
