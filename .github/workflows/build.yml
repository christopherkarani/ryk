name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: zig build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS hosted runners are billed; Seatbelt/build proof is local.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # PCRE2 is built from source via build.zig.zon (static link); no system package required.
      - name: Build
        shell: bash
        run: ./scripts/zig build
      - name: Assert zig build does not invoke cargo
        shell: bash
        run: ./scripts/assert-zig-build-no-cargo.sh
      - name: Version JSON
        shell: bash
        run: |
          ./zig-out/bin/ryk version --json
      - name: Check Windows target from Unix runners
        if: runner.os != 'Windows'
        run: ./scripts/zig build check-windows
      - name: Check release artifact naming references
        shell: bash
        run: |
          grep -R "ryk-v.*linux-amd64" scripts packaging .github/workflows
          grep -R "checksums.txt" scripts packaging .github/workflows
