# ryk preset: cline-roo
# Generic/experimental coding DCG defaults for local editor agents with MCP-style extensions.
# Authoritative embedded source: src/policy/presets.zig (coding_dcg_policy).

version: 1
mode: strict

workspace:
  root: "."
  write_mode: staged

env:
  inherit: false
  allow:
    - PATH
    - HOME
    - LANG
    - TERM
    - RYK_UNATTENDED
    - RYK_OPENCLAW_UNATTENDED
  deny_patterns:
    - "*TOKEN*"
    - "*SECRET*"
    - "*PASSWORD*"
    - "*PASSWD*"
    - "*PRIVATE*"
    - "*KEY*"
    - "AWS_*"
    - "AZURE_*"
    - "GITHUB_TOKEN"
    - "GH_TOKEN"
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "GOOGLE_API_KEY"
    - "GOOGLE_APPLICATION_CREDENTIALS"
    - "NPM_TOKEN"
    - "PYPI_TOKEN"
    - "SSH_AUTH_SOCK"

files:
  read:
    allow:
      - "./**"
    deny:
      # Expanded secret protections (kept in sync with embedded coding_dcg_rules).
      - "./.env"
      - "./.env.*"
      - "~/.ssh/**"
      - "~/.aws/**"
      - "~/.gcloud/**"
      - "~/.azure/**"
      - "~/.config/gh/**"
      - "~/Library/Keychains/**"
      - "./Library/Keychains/**"
      - "~/Library/Application Support/**/Cookies*"
      - "./Library/Application Support/**/Cookies*"
      - "~/Library/Application Support/**/Login Data*"
      - "./Library/Application Support/**/Login Data*"
      - "~/Library/Application Support/Google/Chrome/**"
      - "./Library/Application Support/Google/Chrome/**"
      - "~/Library/Application Support/BraveSoftware/**"
      - "./Library/Application Support/BraveSoftware/**"
      - "~/Library/Application Support/Firefox/**"
      - "./Library/Application Support/Firefox/**"
      - "~/Library/Mobile Documents/**"
      - "./Library/Mobile Documents/**"
      - "~/.zsh_history"
      - "~/.bash_history"
      - "~/.zshrc"
      - "~/.bashrc"
      - "~/.profile"
      - "**/id_rsa"
      - "**/id_ed25519"
      - "**/credentials.json"
      - "**/.credentials.json"
      - "**/secrets.json"
      - "**/secrets.yaml"
      - "**/secrets.yml"
      - "**/.secrets"
      - "**/application_default_credentials.json"
      - "**/service_account.json"
      - "~/.config/gcloud/**"
  write:
    allow:
      - "./**"
    deny:
      # Dual patterns for robustness across hook/plugin callers.
      - "./.git/**"
      - ".git/**"
      - "./.ryk/**"
      - ".ryk/**"
    mode: staged

commands:
  default: allow
  # Matrix-only Strict: empty commands.allow disables off-list refuse.
  # Packs + hard fence block high/critical; deny patterns for catastrophes.
  # Unmatched shell allows — normal coding work is not approval-gated.
  deny:
    - "rm -rf *"
    - "find * -delete"
    - "shred *"
    - "curl * | sh"
    - "wget * | bash"
    - "sudo *"
    - "su *"
    - "doas *"
    - "powershell *EncodedCommand*"
    - "powershell *-enc*"
    - "cat .env"
    - "cat ~/.ssh/*"

network:
  mode: allowlist
  # Authoritative runtime preset: src/policy/presets.zig (coding_dcg_rules).
  default: deny
  allow:
    - "api.github.com"
    - "*.github.com"
    - "registry.npmjs.org"
    - "pypi.org"
  ask:
    - "*.githubusercontent.com"
  deny:
    - "pastebin.com"
    - "*.ngrok.io"
    - "*.requestbin.net"
  detect_exfiltration:
    dns: true
    long_query_strings: true
    secret_patterns: true

mcp:
  default: ask
  allow:
    - "*.search_*"
    - "*.list_*"
    - "*.get_*"
    - "glob"
    - "grep"
    - "list"
    - "read"
    - "todowrite"
    - "todoread"
    - "skill"
    - "task"
    - "question"
    - "lsp"
  deny:
    - "*.delete_*"
    - "*.shell"
    - "*.run_command"

audit:
  level: full
  redact_secrets: true
  tamper_evident: true
