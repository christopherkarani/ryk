version: 1
mode: strict

workspace:
  root: "."
  write_mode: staged

env:
  inherit: false
  allow:
    - PATH
    - HOME
    - LANG
    - TERM
  deny_patterns:
    - "*TOKEN*"
    - "*SECRET*"
    - "*PASSWORD*"
    - "*PASSWD*"
    - "*PRIVATE*"
    - "*KEY*"
    - "AWS_*"
    - "AZURE_*"
    - "GITHUB_TOKEN"
    - "GH_TOKEN"
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "GOOGLE_API_KEY"
    - "GOOGLE_APPLICATION_CREDENTIALS"
    - "NPM_TOKEN"
    - "PYPI_TOKEN"
    - "SSH_AUTH_SOCK"

files:
  read:
    allow:
      - "./**"
    deny:
      - "./.env"
      - "./.env.*"
      - "~/.ssh/**"
      - "~/.aws/**"
  write:
    allow:
      - "./**"
    deny:
      - "./.git/**"
      - "./.ryk/**"
    mode: staged

commands:
  default: ask
  # Sample agents-oriented permit. Full agents default lives in
  # common_strict_rules / generic-agent preset (see docs/presets.md).
  allow:
    - "git status"
    - "git status*"
    - "git diff"
    - "git diff *"
    - "git log"
    - "git log *"
    - "git add *"
    - "git commit *"
    - "ls"
    - "ls *"
    - "pwd"
    - "rg *"
    - "gh auth status"
    - "gh pr *"
    - "npm test*"
    - "ryk explain *"
  deny:
    - "rm -rf *"
    - "curl * | sh"
    - "sudo *"
  ask:
    - "git push*"
    - "npm install*"

network:
  default: deny
  allow:
    - "api.github.com"
    - "registry.npmjs.org"

mcp:
  default: ask
  allow:
    - "*.search_*"
    - "*.list_*"
    - "*.get_*"
  deny:
    - "*.delete_*"
    - "*.shell"
    - "*.run_command"

audit:
  level: full
  redact_secrets: true
  tamper_evident: true
